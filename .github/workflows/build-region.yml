name: Build offline map region

# Downloads a Geofabrik OSM extract, clips it to a bounding box, and builds
# a PMTiles archive with Planetiler (the same tool/schema Protomaps' own
# basemap tiles use — matches the earth/landuse/water/buildings/roads
# layers js/app.js styles). Runs on GitHub's runners because they have
# unrestricted internet access to OSM data sources that some sandboxed dev
# environments (this repo was originally scaffolded from one) may not.
on:
  workflow_dispatch:
    inputs:
      region_name:
        description: "Short id for this region (used as the filename and manifest key, e.g. north-georgia-mountains)"
        required: true
        default: "north-georgia-mountains"
      region_label:
        description: "Human-readable label shown in the app's Offline Maps panel"
        required: true
        default: "North Georgia Mountains (Blood Mountain / Chattahoochee NF)"
      geofabrik_path:
        description: "Geofabrik extract path to download from (without -latest.osm.pbf), e.g. north-america/us/georgia"
        required: true
        default: "north-america/us/georgia"
      bbox:
        description: "Clip bounding box as minLon,minLat,maxLon,maxLat"
        required: true
        default: "-84.3,34.5,-83.5,35.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download source OSM extract from Geofabrik
        run: curl -L --fail -o source.osm.pbf "https://download.geofabrik.de/${{ inputs.geofabrik_path }}-latest.osm.pbf"

      - name: Clip to the requested bounding box
        run: osmium extract --bbox "${{ inputs.bbox }}" --strategy=smart -o clipped.osm.pbf --overwrite source.osm.pbf

      - name: Download Planetiler
        run: curl -L --fail -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Build PMTiles
        # --download also fetches this default (OpenMapTiles-schema) profile's
        # auxiliary global datasets (water polygons, natural earth, lake
        # centerlines) — osm_path is set explicitly so it reuses the already
        # -clipped local file instead of re-downloading OSM data.
        run: java -Xmx6g -jar planetiler.jar --download --osm_path=clipped.osm.pbf --output=region.pmtiles

      - name: Update regions-manifest.json from the archive's own header
        run: |
          npm install pmtiles --no-save --no-fund --no-audit
          node .github/scripts/update-manifest.mjs region.pmtiles "${{ inputs.region_name }}" "${{ inputs.region_label }}" \
            "Data © OpenStreetMap contributors, ODbL. Built from geofabrik.de/${{ inputs.geofabrik_path }}."

      - name: Move archive into data/regions/
        run: mv region.pmtiles "data/regions/${{ inputs.region_name }}.pmtiles"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "data/regions/${{ inputs.region_name }}.pmtiles" data/regions/regions-manifest.json
          git commit -m "Add offline region: ${{ inputs.region_label }}"
          # main can move between checkout and here (another push, or another
          # region build finishing first) — rebase onto the current tip and
          # retry a few times rather than failing on a stale non-fast-forward.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && break
            sleep $((i * 5))
          done
