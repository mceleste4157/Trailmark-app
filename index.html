<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trailmark</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
<!-- iOS "Add to Home Screen" ignores the web manifest entirely — it only
     ever looks at this tag (and only accepts PNG, not the SVG above). -->
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="theme-color" content="#166534" />
<!-- Launches full-screen from the iOS home screen (no Safari chrome),
     which matters for something meant to sit in a dash mount. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trailmark" />

<!-- Vendored locally (not CDN) so the service worker can cache these for
     offline use — see vendor/README.md for versions and how to update. -->
<link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
<script src="vendor/dexie/dexie.js"></script>
<script src="vendor/supabase/supabase.js"></script>

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="map"></div>
<div id="map-hint">
  No offline map downloaded yet.<br />
  Tap <strong>Offline Maps</strong> below to download a region.
</div>
<button id="locate-banner">📍 Tap to show your location</button>
<button id="update-banner" class="hidden">⬆️ Update available — tap to refresh</button>
<button id="error-banner" class="hidden">⚠️ Something went wrong — tap to report it</button>
<button id="maintenance-reminder-banner" class="hidden">🔧 Maintenance due — tap to view</button>

<header id="topbar">
  <span id="app-title">Trailmark <button id="btn-version" title="Version history">v1.00</button></span>
  <span id="topbar-right">
    <button id="btn-basemap" title="Toggle satellite/streets basemap">🗺️ Streets</button>
    <button id="btn-layers" title="Map layers: 3D terrain, radar, cell coverage">🗂️ Layers</button>
    <button id="btn-weather" title="Weather & sunset for your location (or the map view, if location's off)">🌤️ Weather</button>
    <button id="btn-settings" title="Settings: trip folders, sign in/out">⚙️</button>
    <button id="btn-theme" title="Toggle light/dark mode">☀️</button>
    <span id="status-pill" class="offline">checking…</span>
    <div id="stats-hud">
      <span class="stat"><span class="stat-value" id="stat-speed">--</span><span class="stat-label">mph</span></span>
      <button class="stat" id="btn-orientation" title="Tap to toggle North-up / direction-of-travel-up">
        <span class="stat-arrow" id="stat-heading-arrow">&uarr;</span><span class="stat-value" id="stat-heading">--</span><span class="stat-mode" id="stat-orientation-mode">N-UP</span>
      </button>
      <span class="stat"><span class="stat-value" id="stat-elevation">--</span><span class="stat-label">ft elev</span></span>
      <button class="stat" id="btn-tilt" title="Tap to enable the tilt/roll sensor (mount the phone the way it'll ride in the vehicle)">
        <span class="stat-value" id="stat-tilt">--</span><span class="stat-label">tilt</span>
      </button>
    </div>
  </span>
</header>

<nav id="toolbar">
  <button id="btn-record" data-mode="record" title="Start recording a track, and share your location if signed in">
    <span class="toolbar-icon">🧭</span><span class="toolbar-label">Go &amp; Track</span>
  </button>
  <button id="btn-tools" data-mode="tools" title="Photo, Waypoint, Plan a Route">
    <span class="toolbar-icon">🛠️</span><span class="toolbar-label">Tools</span>
  </button>
  <button id="btn-trails" data-mode="trails" title="Your trails, routes, and waypoints">
    <span class="toolbar-icon">📁</span><span class="toolbar-label">My Content</span>
  </button>
  <button id="btn-regions" data-mode="regions" title="Manage offline regions">
    <span class="toolbar-icon">📥</span><span class="toolbar-label">Offline Maps</span>
  </button>
  <button id="btn-group" data-mode="group" title="Chat with the crew">
    <span class="toolbar-icon">💬</span><span class="toolbar-label">Chat</span><span id="chat-badge" class="hidden"></span>
  </button>
</nav>
<input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none;" />

<div id="panel" class="hidden">
  <div id="panel-header">
    <span id="panel-title"></span>
    <button id="panel-close" aria-label="Close">&times;</button>
  </div>
  <div id="panel-body"></div>
</div>

<div id="undo-toast" class="hidden">
  <span id="undo-toast-msg"></span>
  <button id="undo-toast-btn">Undo</button>
</div>

<div id="recording-hud" class="hidden">
  <span id="recording-dot"></span>
  <span id="recording-time">00:00</span>
  <span id="recording-dist">0.00 mi</span>
  <button id="btn-stop-recording">Stop &amp; Save</button>
</div>

<div id="planning-hud" class="hidden">
  <span>Tap the map to add points · <span id="planning-count">0</span> pts · <span id="planning-dist">0.00 mi</span></span>
  <button id="btn-planning-undo">Undo</button>
  <button id="btn-planning-finish">Finish &amp; Save</button>
  <button id="btn-planning-cancel">Cancel</button>
</div>

<script src="js/db.js"></script>
<script src="js/gps.js"></script>
<script src="js/group/config.js"></script>
<script src="js/group/backend.js"></script>
<script src="js/cell-coverage.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
