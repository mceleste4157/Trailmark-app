<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trailmark</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#166534" />

<!-- Vendored locally (not CDN) so the service worker can cache these for
     offline use — see vendor/README.md for versions and how to update. -->
<link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
<script src="vendor/pmtiles/pmtiles.js"></script>
<script src="vendor/dexie/dexie.js"></script>
<script src="vendor/supabase/supabase.js"></script>

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="map"></div>
<div id="map-hint">
  No offline map downloaded yet.<br />
  Tap <strong>Offline Maps</strong> below to download a region.
</div>

<header id="topbar">
  <span id="app-title">Trailmark</span>
  <span id="topbar-right">
    <button id="btn-basemap" title="Toggle satellite/streets basemap">🗺️ Streets</button>
    <button id="btn-terrain" title="Toggle terrain shading (elevation)">⛰️</button>
    <button id="btn-cell" class="hidden" title="Toggle cell tower locations (coverage proxy)">📶</button>
    <span id="status-pill" class="offline">checking…</span>
  </span>
</header>

<nav id="toolbar">
  <button id="btn-record" data-mode="record" title="Record a trail">Record</button>
  <button id="btn-waypoint" data-mode="waypoint" title="Drop a waypoint">Waypoint</button>
  <button id="btn-regions" data-mode="regions" title="Manage offline regions">Offline Maps</button>
  <button id="btn-trails" data-mode="trails" title="View saved trails">My Trails</button>
  <button id="btn-group" data-mode="group" title="Group: chat, live locations, sign in">Group</button>
</nav>

<button id="btn-emergency" class="hidden" title="Alert your group">SOS</button>

<div id="panel" class="hidden">
  <div id="panel-header">
    <span id="panel-title"></span>
    <button id="panel-close" aria-label="Close">&times;</button>
  </div>
  <div id="panel-body"></div>
</div>

<div id="recording-hud" class="hidden">
  <span id="recording-dot"></span>
  <span id="recording-time">00:00</span>
  <span id="recording-dist">0.00 mi</span>
  <button id="btn-stop-recording">Stop &amp; Save</button>
</div>

<div id="planning-hud" class="hidden">
  <span>Tap the map to add points · <span id="planning-count">0</span> pts · <span id="planning-dist">0.00 mi</span></span>
  <button id="btn-planning-undo">Undo</button>
  <button id="btn-planning-finish">Finish &amp; Save</button>
  <button id="btn-planning-cancel">Cancel</button>
</div>

<script src="js/db.js"></script>
<script src="js/gps.js"></script>
<script src="js/offline-regions.js"></script>
<script src="js/group/config.js"></script>
<script src="js/group/backend.js"></script>
<script src="js/cell-coverage.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
