<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trailmark</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#166534" />

<!-- Vendored locally (not CDN) so the service worker can cache these for
     offline use — see vendor/README.md for versions and how to update. -->
<link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
<script src="vendor/pmtiles/pmtiles.js"></script>
<script src="vendor/dexie/dexie.js"></script>

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Temporary on-page error reporting: shows JS errors directly on the
     phone screen so they're visible without a computer/devtools. Remove
     once the mobile blank-map issue is confirmed fixed. -->
<div id="diag" style="display:none;position:fixed;inset:0;z-index:9999;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;padding:14px;overflow:auto;white-space:pre-wrap;"></div>
<script>
(function () {
  var box = document.getElementById("diag");
  var lines = [];
  function show(msg) {
    lines.push(msg);
    box.textContent = lines.join("\n\n");
    box.style.display = "block";
  }
  window.addEventListener("error", function (e) {
    show("[error] " + (e.message || "unknown") + "\n  at " + (e.filename || "?") + ":" + e.lineno + ":" + e.colno);
  });
  window.addEventListener("unhandledrejection", function (e) {
    show("[unhandledrejection] " + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!window.__mapInitialized) {
        show("[diag] 5s after load, window.__mapInitialized is still false — js/app.js's module script likely never ran (or hung before reaching map init). typeof maplibregl import worked: " + (typeof window.__maplibreLoaded));
      }
    }, 5000);
  });
})();
</script>

<div id="map"></div>

<header id="topbar">
  <span id="app-title">Trailmark</span>
  <span id="status-pill" class="offline">checking…</span>
</header>

<nav id="toolbar">
  <button id="btn-record" data-mode="record" title="Record a trail">Record</button>
  <button id="btn-waypoint" data-mode="waypoint" title="Drop a waypoint">Waypoint</button>
  <button id="btn-regions" data-mode="regions" title="Manage offline regions">Offline Maps</button>
  <button id="btn-trails" data-mode="trails" title="View saved trails">My Trails</button>
</nav>

<div id="panel" class="hidden">
  <div id="panel-header">
    <span id="panel-title"></span>
    <button id="panel-close" aria-label="Close">&times;</button>
  </div>
  <div id="panel-body"></div>
</div>

<div id="recording-hud" class="hidden">
  <span id="recording-dot"></span>
  <span id="recording-time">00:00</span>
  <span id="recording-dist">0.00 mi</span>
  <button id="btn-stop-recording">Stop &amp; Save</button>
</div>

<script src="js/db.js"></script>
<script src="js/gps.js"></script>
<script src="js/offline-regions.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
