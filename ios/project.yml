name: Trailmark

options:
  bundleIdPrefix: com.mceleste
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.mceleste.trailmark

targets:
  Trailmark:
    type: application
    platform: iOS
    sources:
      - path: Trailmark
        excludes:
          - Info.plist
          - Trailmark.entitlements
    info:
      path: Trailmark/Info.plist
    entitlements:
      path: Trailmark/Trailmark.entitlements
    settings:
      base:
        PRODUCT_NAME: Trailmark
        INFOPLIST_FILE: Trailmark/Info.plist
        CODE_SIGN_ENTITLEMENTS: Trailmark/Trailmark.entitlements
    frameworks:
      - CarPlay
      - CoreLocation
      - MapKit
      - SwiftUI
